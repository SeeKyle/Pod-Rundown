<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bell" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#eaffd9" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#8ff09a" stop-opacity=".9"/>
      <stop offset=".8" stop-color="#2fae52" stop-opacity=".85"/>
      <stop offset="1" stop-color="#14632c" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4ffb0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#b6ff5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf08f" stop-opacity=".95"/>
      <stop offset="1" stop-color="#3fcf5a" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ffc0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6fe27f" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <!-- trailing tentacles -->
  <g fill="none" stroke="url(#tent)" stroke-linecap="round">
    <path d="M14 30 C11 38 17 43 13 51 C10 57 14 61 12 63" stroke-width="1.6"/>
    <path d="M21 32 C19 40 24 45 21 53 C19 58 22 61 21 63" stroke-width="1.4"/>
    <path d="M43 32 C45 40 40 45 43 53 C45 58 42 61 43 63" stroke-width="1.4"/>
    <path d="M50 30 C53 38 47 43 51 51 C54 57 50 61 52 63" stroke-width="1.6"/>
  </g>
  <!-- frilly oral arms -->
  <g fill="url(#arm)" stroke="#2a9a48" stroke-width=".6" stroke-opacity=".6">
    <path d="M26 31 C24 37 28 39 26 44 C24 49 28 52 27 57 C30 52 31 47 30 42 C32 38 30 34 31 31 Z"/>
    <path d="M38 31 C40 37 36 39 38 44 C40 49 36 52 37 57 C34 52 33 47 34 42 C32 38 34 34 33 31 Z"/>
    <path d="M31 31 C30 39 33 44 31 50 C30 54 32 58 32 60 C33 56 35 52 34 47 C33 41 34 36 33 31 Z" fill-opacity=".8"/>
  </g>
  <!-- bell -->
  <path d="M8 31 C8 15 19 6 32 6 C45 6 56 15 56 31 C53 29.5 51 32 48 30.5 C45 32.5 43 30 40 31.5 C37 29.8 35 32.3 32 30.8 C29 32.3 27 29.8 24 31.5 C21 30 19 32.5 16 30.5 C13 32 11 29.5 8 31 Z"
        fill="url(#bell)" stroke="#0c4a1e" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- inner glow and gonads (the four-leaf pattern real moon jellies have) -->
  <ellipse cx="32" cy="20" rx="12" ry="8" fill="url(#core)"/>
  <g fill="#c9ff6a" fill-opacity=".55" stroke="#4fd06a" stroke-opacity=".6" stroke-width=".6">
    <ellipse cx="27" cy="18.5" rx="3.4" ry="2.4" transform="rotate(-25 27 18.5)"/>
    <ellipse cx="37" cy="18.5" rx="3.4" ry="2.4" transform="rotate(25 37 18.5)"/>
    <ellipse cx="27.5" cy="23.5" rx="3.2" ry="2.2" transform="rotate(25 27.5 23.5)"/>
    <ellipse cx="36.5" cy="23.5" rx="3.2" ry="2.2" transform="rotate(-25 36.5 23.5)"/>
  </g>
  <!-- radial canals -->
  <g stroke="#1f8a3c" stroke-opacity=".45" stroke-width=".7" fill="none">
    <path d="M32 9 L32 30"/><path d="M20 12 C24 18 24 25 22 30"/><path d="M44 12 C40 18 40 25 42 30"/>
    <path d="M12 20 C16 24 16 27 15 30"/><path d="M52 20 C48 24 48 27 49 30"/>
  </g>
  <!-- rim dots and shine -->
  <g fill="#efffe8" fill-opacity=".85">
    <circle cx="12" cy="29.5" r=".9"/><circle cx="20" cy="30.8" r=".9"/><circle cx="28" cy="30.6" r=".9"/>
    <circle cx="36" cy="30.6" r=".9"/><circle cx="44" cy="30.8" r=".9"/><circle cx="52" cy="29.5" r=".9"/>
  </g>
  <path d="M15 20 C17 13 23 9.5 29 9" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="21" cy="15" rx="1.6" ry="1" fill="#fff" fill-opacity=".8"/>
</svg>
